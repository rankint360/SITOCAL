# Review plan/disk costs in Render before applying this blueprint.
services:
  - type: web
    name: sitocal
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: sitocal-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: BASE_DOMAIN
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: ALLOW_SIGNUPS
        value: "false"
      - key: ENCRYPTION_KEY
        sync: false
      - key: REGISTRATION_CODE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
